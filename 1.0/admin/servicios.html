<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Servicios</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/admin.css"></head><body><header class="adm-topbar"><div><div class="adm-topbar-title">Servicios</div><div class="adm-topbar-sub">Precios, duración, colchón e imagen</div></div><div class="adm-topbar-actions"><a class="btn btn-ghost" href="index.html">Dashboard</a><a class="btn btn-ghost" href="configuracion.html">Mi negocio</a><button id="btn-logout" class="btn btn-ghost">Salir</button></div></header><main class="adm-main"><section class="adm-form"><div class="adm-section-heading"><div><span class="adm-kicker">Catálogo comercial</span><h2 class="adm-h2">Agregar / editar servicio</h2><p>Un buen catálogo ayuda al cliente a decidir más rápido. Usa nombres claros, foto, categoría y una descripción breve.</p></div></div><input id="sid" type="hidden"><div class="form-grid"><input id="sname" placeholder="Nombre del servicio"><div class="field-with-help"><input id="category" placeholder="Categoría" value="Servicios" list="service-category-suggestions"><datalist id="service-category-suggestions"><option value="Cabello"><option value="Uñas"><option value="Rostro"><option value="Cejas y pestañas"><option value="Maquillaje"><option value="Masajes"><option value="Depilación"><option value="Barbería"><option value="Spa"><option value="Paquetes"></datalist><small>Ej. Cabello, Uñas, Rostro, Masajes o Paquetes</small></div><input id="price" type="number" step="0.01" placeholder="Precio"><input id="duration" type="number" placeholder="Duración min"><input id="buffer" type="number" placeholder="Tiempo entre citas min" value="0"><input id="deposit" type="number" step="0.01" placeholder="Anticipo opcional"><textarea id="sdesc" rows="3" placeholder="Describe qué incluye, para quién es y el resultado esperado. Ej. Lavado + corte + peinado final."></textarea><input id="simage" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="form-check-group">
  <label class="form-check">
    <div class="form-check-text">
      <span class="form-check-title">Disponible para reservar</span>
      <span class="form-check-help">Si lo desactivas, el servicio se oculta de tu página pública y los clientes no podrán agendarlo — pero sigue guardado, puedes reactivarlo cuando quieras.</span>
    </div>
    <input id="active" type="checkbox" checked>
  </label>
  <label class="form-check">
    <div class="form-check-text">
      <span class="form-check-title">Destacado</span>
      <span class="form-check-help">Aparece primero en el catálogo de tu página pública, antes que el resto de tus servicios.</span>
    </div>
    <input id="featured" type="checkbox">
  </label>
</div><div class="mt-16"><button id="save-service" class="btn btn-primary">Guardar servicio</button><button id="clear-service" class="btn btn-ghost">Nuevo</button></div></section><h2 class="adm-h2">Catálogo</h2><div id="service-list" class="catalog-grid"></div></main><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script>
<script src="../js/supabase.js"></script><script src="../js/admin-auth.js"></script><script src="../js/admin-services.js"></script></body></html>
