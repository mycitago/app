<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda · MyCitaGo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/citago-admin.css"><link rel="stylesheet" href="../css/admin-agenda.css"></head><body><div id="citago-shell"></div><main class="agenda-page">
<header class="ct-page-head agenda-head"><div><span class="ct-eyebrow">AGENDA</span><h1>Tu agenda, a tu manera</h1><p>Cambia de vista según el ritmo de tu negocio y filtra por sucursal, profesional o servicio.</p></div><div class="agenda-date-actions"><button id="agenda-prev" class="ct-btn ct-btn-secondary" aria-label="Anterior">‹</button><button id="agenda-today" class="ct-btn ct-btn-secondary">Hoy</button><button id="agenda-next" class="ct-btn ct-btn-secondary" aria-label="Siguiente">›</button></div></header>
<section class="agenda-toolbar ct-card"><div class="agenda-view-switch" role="group" aria-label="Vista de agenda"><button data-agenda-view="day">Día</button><button data-agenda-view="3day">3 días</button><button data-agenda-view="week">Semana</button><button data-agenda-view="month">Mes</button><button data-agenda-view="list">Lista</button></div><div class="agenda-filters"><select id="agenda-branch-filter"><option value="">Todas las sucursales</option></select><select id="agenda-staff-filter"><option value="">Todos los profesionales</option></select><select id="agenda-service-filter"><option value="">Todos los servicios</option></select></div></section>
<section class="agenda-summary"><div><span>Periodo</span><strong id="agenda-range">—</strong></div><div><span>Citas</span><strong id="agenda-count">0</strong></div><div><span>Confirmadas</span><strong id="agenda-confirmed">0</strong></div><div><span>Ocupación estimada</span><strong id="agenda-utilization">0%</strong></div></section>
<section id="agenda-calendar-shell" class="calendar-shell"><div class="calendar-head" id="calendar-head"></div><div class="calendar-body"><div class="time-axis" id="time-axis"></div><div class="calendar-grid" id="calendar-grid"></div></div></section>
<section id="agenda-month" class="agenda-month ct-card hidden"></section>
<section id="agenda-list-shell" class="agenda-mobile-list ct-card"><div class="card-head"><div><span class="ct-eyebrow">LISTA</span><h2>Próximas citas</h2></div></div><div id="agenda-list"></div></section>
</main><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-auth.js"></script><script src="../js/admin-agenda.js"></script><script src="../js/citago-shell.js"></script><script>document.addEventListener('DOMContentLoaded',()=>CitagoShell.mount({mode:'tenant',activePage:'agenda'}));</script></body></html>
