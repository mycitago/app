<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Contabilidad</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/admin-design-system.css">
</head>
<body>
  <div id="app-shell"></div>

<header class="adm-topbar">
  <div>
    <div class="adm-topbar-title" id="biz-name">Cargando…</div>
    <div class="adm-topbar-sub">Contabilidad</div>
  </div>
  <div class="adm-topbar-actions">
    <a href="index.html" class="btn btn-ghost">Dashboard</a>
    <button id="btn-logout" class="btn btn-ghost">Salir</button>
  </div>
</header>

<main class="adm-main">

  <div class="adm-period">
    <label for="month-picker">Mes</label>
    <input type="month" id="month-picker">
  </div>

  <section class="adm-kpis">
    <div class="adm-kpi"><div class="adm-kpi-num adm-green" id="kpi-income">$0.00</div><div class="adm-kpi-label">Ingresos (completadas)</div></div>
    <div class="adm-kpi"><div class="adm-kpi-num adm-red" id="kpi-expenses">$0.00</div><div class="adm-kpi-label">Gastos</div></div>
    <div class="adm-kpi"><div class="adm-kpi-num" id="kpi-profit">$0.00</div><div class="adm-kpi-label">Ganancia</div></div>
  </section>
  <p class="adm-note" id="kpi-note"></p>

  <section>
    <h2 class="adm-h2">Agregar gasto</h2>
    <div class="adm-form">
      <div class="field">
        <label for="exp-concept">Concepto</label>
        <input type="text" id="exp-concept" placeholder="Ej. Compra de tintes">
      </div>
      <div class="adm-form-row">
        <div class="field">
          <label for="exp-category">Categoría</label>
          <select id="exp-category">
            <option value="insumos">Insumos</option>
            <option value="renta">Renta</option>
            <option value="sueldos">Sueldos</option>
            <option value="servicios">Servicios (luz, agua…)</option>
            <option value="marketing">Marketing</option>
            <option value="mantenimiento">Mantenimiento</option>
            <option value="otros">Otros</option>
          </select>
        </div>
        <div class="field">
          <label for="exp-amount">Monto</label>
          <input type="number" id="exp-amount" min="0.01" step="0.01" placeholder="0.00">
        </div>
        <div class="field">
          <label for="exp-date">Fecha</label>
          <input type="date" id="exp-date">
        </div>
      </div>
      <button id="btn-add-expense" class="btn btn-primary">Guardar gasto</button>
    </div>
  </section>

  <section>
    <h2 class="adm-h2">Gastos del mes</h2>
    <div id="list-expenses" class="adm-list"></div>
  </section>

  <section>
    <h2 class="adm-h2">Evolución financiera</h2>
    <div class="adm-chart-card">
      <div class="adm-chart-head">
        <div><div class="adm-chart-title">Ingresos vs. gastos</div><div class="adm-chart-sub">Comportamiento de los últimos 6 meses</div></div>
        <div class="adm-chart-legend"><span>Ingresos</span><span>Gastos</span></div>
      </div>
      <div class="adm-chart-wrap"><canvas id="finance-chart"></canvas></div>
    </div>
    <div id="summary-6m" class="adm-list" style="margin-top:12px"></div>
  </section>

</main>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="../js/admin-accounting.js"></script>
  <script src="../js/admin-nav.js"></script>
</body>
</html>
