<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi página · MyCitaGo</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/citago-admin.css"><link rel="stylesheet" href="../css/admin-branding.css"></head><body><div id="citago-shell"></div><main><header class="ct-page-head"><div><span class="ct-eyebrow">PÁGINA PÚBLICA</span><h1>Diseña tu espacio</h1><p>Personaliza tu página de servicios y publica cuando esté lista.</p></div><div><button id="save-branding" class="ct-btn ct-btn-secondary">Guardar borrador</button> <button id="publish-branding" class="ct-btn ct-btn-primary">Publicar cambios</button></div></header><div class="branding-layout"><form id="branding-form" class="ct-card branding-panel"><div class="ct-form-grid"><div class="ct-form-field"><label>Color principal</label><input id="primary_color" type="color" value="#7c3aed"></div><div class="ct-form-field"><label>Color secundario</label><input id="secondary_color" type="color" value="#17151f"></div><div class="ct-form-field"><label>Fondo</label><input id="background_color" type="color" value="#ffffff"></div><div class="ct-form-field"><label>Texto</label><input id="text_color" type="color" value="#191724"></div><div class="ct-form-field"><label>Tipografía</label><select id="font_family"><option>Manrope</option><option>Inter</option><option>Georgia</option><option>Arial</option></select></div><div class="ct-form-field"><label>Botones</label><select id="button_style"><option value="rounded">Redondeados</option><option value="pill">Píldora</option><option value="square">Rectos</option></select></div><div class="ct-form-field full"><label>Título principal</label><input id="hero_title" placeholder="Reserva tu próxima cita"></div><div class="ct-form-field full"><label>Texto de bienvenida</label><textarea id="hero_subtitle" rows="3" placeholder="Cuéntales por qué elegir tu negocio"></textarea></div><div class="ct-form-field"><label>Logo</label><label class="brand-upload-card" id="branding-logo-card"><div class="brand-upload-card-body"><div class="brand-upload-icon">◈</div><b>Subir logo</b><span id="branding-logo-name">PNG, JPG o WebP · máx. 5 MB</span></div><input id="branding-logo" type="file" accept="image/jpeg,image/png,image/webp"></label></div><div class="ct-form-field"><label>Portada</label><label class="brand-upload-card" id="branding-cover-card"><div class="brand-upload-card-body"><div class="brand-upload-icon">▣</div><b>Subir portada</b><span id="branding-cover-name">Horizontal recomendado · máx. 5 MB</span></div><input id="branding-cover" type="file" accept="image/jpeg,image/png,image/webp"></label></div></div><div class="branding-preset-block"><label>Imágenes precargadas MyCitaGo</label><p>Elige una portada profesional y después reemplázala por tus propias fotos cuando quieras.</p><div id="branding-cover-presets" class="branding-cover-presets"><button type="button" data-cover="../assets/marketing/agenda.jpg"><img src="../assets/marketing/agenda.jpg" alt="Agenda"></button><button type="button" data-cover="../assets/marketing/clientes.jpg"><img src="../assets/marketing/clientes.jpg" alt="Clientes"></button><button type="button" data-cover="../assets/marketing/mobile.jpg"><img src="../assets/marketing/mobile.jpg" alt="Reserva móvil"></button><button type="button" data-cover="../assets/marketing/hero-platform.jpg"><img src="../assets/marketing/hero-platform.jpg" alt="MyCitaGo"></button></div></div><div><label style="font-size:11px;font-weight:750">Secciones visibles</label><div id="section-visibility" class="section-checks"></div></div><small id="branding-status" style="color:var(--ct-muted)">Los cambios son borrador hasta publicar.</small></form><aside class="branding-preview-shell"><div class="branding-preview-toolbar"><strong>Vista previa</strong><div class="ct-tabs"><button type="button" class="ct-tab active" data-preview="desktop">Escritorio</button><button type="button" class="ct-tab" data-preview="mobile">Móvil</button></div></div><div id="brand-preview" class="brand-preview"></div></aside></div></main><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-auth.js"></script><script src="../js/media-manager.js"></script><script src="../js/admin-branding.js"></script><script src="../js/citago-shell.js"></script><script>document.addEventListener('DOMContentLoaded',()=>CitagoShell.mount({mode:'tenant',activePage:'mi-pagina'}));</script></body></html>
