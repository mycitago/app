<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyCitaGo · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-login-mycitago.css">
<link rel="stylesheet" href="../css/mycitago-themes.css">
<script src="../js/ui-theme.js"></script>
</head>
<body class="adm-login-body">

<main class="adm-login-card">
  <img class="mycitago-login-logo" src="../assets/brand/mycitago-logo.png" alt="MyCitaGo">
  <span class="login-kicker">GESTIÓN DE CITAS Y CLIENTES</span>
  <h1 id="card-title">Bienvenido a MyCitaGo</h1>
  <p class="text-muted" id="card-sub">Ingresa para administrar tu negocio.</p>

  <div id="view-login">
    <button id="btn-google" class="google-auth-btn" type="button" aria-label="Continuar con Google">
      <span class="google-g">G</span><strong>Continuar con Google</strong>
    </button>
    <div class="auth-divider"><span>o usa tu correo</span></div>
    <div class="field"><label for="login-email">Correo</label><input type="email" id="login-email" autocomplete="email" placeholder="tu@correo.com"></div>
    <div class="field"><label for="login-password">Contraseña</label><input type="password" id="login-password" autocomplete="current-password"></div>
    <button id="btn-login" class="btn btn-primary">Entrar</button>
    <div class="adm-links"><button class="adm-link" data-view="forgot">¿Olvidaste tu contraseña?</button><button class="adm-link" data-view="register">Crear una cuenta</button></div>
  </div>

  <div id="view-register" class="hidden">
    <div id="register-google-option"><button id="btn-google-register" class="google-auth-btn" type="button"><span class="google-g">G</span><strong>Crear cuenta con Google</strong></button><div class="auth-divider"><span>o usa tu correo</span></div></div>
    <div id="oauth-profile" class="oauth-profile hidden"><div id="oauth-avatar" class="oauth-avatar">G</div><div><strong id="oauth-name">Cuenta Google conectada</strong><small id="oauth-email"></small></div><span>✓</span></div>
    <div class="field"><label for="reg-business">Nombre de tu negocio</label><input type="text" id="reg-business" placeholder="Ej. Clínica, barbería, consultorio, taller..."><div class="adm-note" id="reg-slug-preview"></div></div>
    <div class="field"><label for="reg-whatsapp">Teléfono / WhatsApp del negocio</label><div class="phone-row"><select id="country-code" aria-label="Código internacional"><option value="+52" selected>🇲🇽 +52</option><option value="+1">🇺🇸 +1</option><option value="+57">🇨🇴 +57</option><option value="+54">🇦🇷 +54</option><option value="+34">🇪🇸 +34</option></select><input type="tel" id="reg-whatsapp" inputmode="tel" autocomplete="tel-national" placeholder="665 544 3322"></div><small class="phone-help">No enviamos SMS. Guardamos el número en formato internacional para WhatsApp y contacto.</small></div>
    <div id="email-register-fields">
      <div class="field"><label for="reg-email">Correo</label><input type="email" id="reg-email" autocomplete="email" placeholder="tu@correo.com"></div>
      <div class="field"><label for="reg-password">Contraseña (mínimo 10 caracteres)</label><input type="password" id="reg-password" autocomplete="new-password"></div>
    </div>
    <button id="btn-register" class="btn btn-primary">Crear cuenta y negocio</button>
    <div class="adm-links"><button class="adm-link" data-view="login">Ya tengo cuenta</button></div>
  </div>

  <div id="view-forgot" class="hidden"><div class="field"><label for="forgot-email">Correo</label><input type="email" id="forgot-email" autocomplete="email" placeholder="tu@correo.com"></div><button id="btn-forgot" class="btn btn-primary">Enviar enlace de recuperación</button><div class="adm-links"><button class="adm-link" data-view="login">Volver a iniciar sesión</button></div></div>
  <div id="view-reset" class="hidden"><div class="field"><label for="reset-password">Nueva contraseña</label><input type="password" id="reset-password" autocomplete="new-password"></div><button id="btn-reset" class="btn btn-primary">Guardar nueva contraseña</button></div>

  <p id="msg-error" class="adm-error hidden"></p><p id="msg-info" class="adm-info hidden"></p>
  <div class="login-trust"><span>✓ Sin tarjeta</span><span>✓ Configuración guiada</span><span>✓ Acceso seguro</span></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/starter-kit.js"></script>
<script>
window.MyCitaGoOAuth = (() => {
  function inviteForOAuth(href){try{return new URL(href).searchParams.get('invite')||''}catch(_){return''}}
  function isOAuthCallback(href){try{const url=new URL(href);return url.searchParams.get('oauth')==='1'||/(?:^|[&#])access_token=/.test(url.hash)||/(?:^|[&#])error=/.test(url.hash)||url.searchParams.has('error')}catch(_){return false}}
  function oauthErrorFromHash(href){try{const url=new URL(href);const hp=new URLSearchParams(url.hash.replace(/^#/,''));return hp.get('error_description')||hp.get('error')||url.searchParams.get('error_description')||url.searchParams.get('error')||null}catch(_){return null}}
  function cleanOAuthUrl(href){const url=new URL(href);['oauth','invite','view','error','error_description'].forEach(k=>url.searchParams.delete(k));url.hash='';return `${url.pathname}${url.search}`}
  function buildOAuthAuthorizeUrl(supabaseUrl,provider,redirectTo){const base=String(supabaseUrl||'').replace(/\/+$/,'');const url=new URL(`${base}/auth/v1/authorize`);url.searchParams.set('provider',provider||'google');if(redirectTo)url.searchParams.set('redirect_to',redirectTo);return url.toString()}
  function waitForAuthSession(client,options){const timeoutMs=Math.max(0,Number(options?.timeoutMs??4000));return new Promise(resolve=>{let done=false,timer=null,subscription=null;const finish=session=>{if(done)return;done=true;if(timer)clearTimeout(timer);subscription?.unsubscribe?.();resolve(session?.user?session:null)};const listener=client.auth.onAuthStateChange((_event,session)=>{if(session?.user)finish(session)});subscription=listener?.data?.subscription||null;timer=setTimeout(()=>finish(null),timeoutMs)})}
  return {inviteForOAuth,isOAuthCallback,oauthErrorFromHash,cleanOAuthUrl,buildOAuthAuthorizeUrl,waitForAuthSession};
})();
</script>
<script>
  if (typeof LOCAL_NO_LOGIN !== 'undefined' && LOCAL_NO_LOGIN) window.location.replace('index.html');
  const views=['login','register','forgot','reset'];
  const titles={login:['Bienvenido a MyCitaGo','Ingresa para administrar tu negocio.'],register:['Crea tu espacio MyCitaGo','Registra tu negocio y empieza con una configuración guiada.'],forgot:['Recuperar contraseña','Te enviaremos un enlace por correo.'],reset:['Nueva contraseña','Escribe tu nueva contraseña.']};
  let oauthMode=false;

  function $(id){return document.getElementById(id)}
  function showView(name){views.forEach(v=>$('view-'+v).classList.toggle('hidden',v!==name));$('card-title').textContent=titles[name][0];$('card-sub').textContent=titles[name][1];hideMsgs()}
  function showError(msg){$('msg-error').textContent=msg;$('msg-error').classList.remove('hidden');$('msg-info').classList.add('hidden')}
  function showInfo(msg){$('msg-info').textContent=msg;$('msg-info').classList.remove('hidden');$('msg-error').classList.add('hidden')}
  function hideMsgs(){$('msg-error').classList.add('hidden');$('msg-info').classList.add('hidden')}
  function mapLoginError(msg){if(/invalid login credentials/i.test(msg||''))return'Correo o contraseña incorrectos.';if(/not confirmed/i.test(msg||''))return'La cuenta no está confirmada todavía.';return msg||'No se pudo iniciar sesión.'}
  function onlyDigits(s){return(s||'').replace(/\D/g,'')}
  function internationalPhone(){const code=$('country-code').value;const national=onlyDigits($('reg-whatsapp').value);return{code,national,e164:`${code}${national}`}}
  function validPhone({national,e164}){if(!national)return false;if($('country-code').value==='+52'&&national.length!==10)return false;return /^\+[1-9]\d{7,14}$/.test(e164)}

  $('reg-business').addEventListener('input',e=>{const slug=slugify(e.target.value);$('reg-slug-preview').textContent=slug?`Tu link será: ${getAppBaseUrl()}reservar.html?n=${slug}`:''});

  async function platformAdminFor(userId){const{data}=await supabaseClient.from('platform_admins').select('id').eq('id',userId).maybeSingle();return !!data}
  async function membershipFor(userId){const{data}=await supabaseClient.from('business_members').select('business_id').eq('user_id',userId).eq('status','active').limit(1);return data?.[0]||null}

  function resetGoogleButton(btn){
    if(!btn)return;
    btn.disabled=false;
    const label=btn.querySelector('strong');
    if(label)label.textContent=btn.id==='btn-google-register'?'Crear cuenta con Google':'Continuar con Google';
  }
  function resetGoogleButtons(){resetGoogleButton($('btn-google'));resetGoogleButton($('btn-google-register'))}

  async function handleGoogle(event){
    hideMsgs();
    const btn=event?.currentTarget||$('btn-google');
    resetGoogleButtons();
    btn.disabled=true;
    btn.querySelector('strong').textContent='Abriendo Google…';
    try{
      if(!window.MyCitaGoOAuth)throw new Error('No se cargó el módulo de acceso con Google. Recarga la página.');
      const invite=window.MyCitaGoOAuth.inviteForOAuth(location.href);
      const redirectTo=`${getAppBaseUrl()}admin/login.html?oauth=1${invite?'&invite='+encodeURIComponent(invite):''}`;
      const authorizeUrl=window.MyCitaGoOAuth.buildOAuthAuthorizeUrl(SUPABASE_URL,'google',redirectTo);
      window.location.assign(authorizeUrl);
    }catch(error){
      resetGoogleButton(btn);showError(error?.message||'No se pudo abrir Google. Intenta de nuevo.');
    }
  }

  async function handleLogin(){hideMsgs();const btn=$('btn-login');btn.disabled=true;btn.textContent='Entrando…';const email=$('login-email').value.trim(),password=$('login-password').value;const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});btn.disabled=false;btn.textContent='Entrar';if(error)return showError(mapLoginError(error.message));if(await platformAdminFor(data.user.id))return location.replace('plataforma.html');location.replace('index.html')}

  async function generateUniqueSlug(name){const base=slugify(name)||'negocio';let candidate=base;for(let attempt=0;attempt<5;attempt++){const{data,error}=await supabaseClient.from('businesses').select('id').eq('slug',candidate).maybeSingle();if(error)break;if(!data)return candidate;candidate=`${base}-${Math.random().toString(36).slice(2,6)}`}return`${base}-${Date.now().toString(36)}`}

  async function completeOAuthBusiness(user,bizName,phone,selectedPlan){
    const slug=await generateUniqueSlug(bizName);
    const{data,error}=await supabaseClient.functions.invoke('complete-onboarding',{body:{business_name:bizName,business_phone:phone.e164,slug,plan_id:selectedPlan,invite_token:new URLSearchParams(location.search).get('invite')||localStorage.getItem('mycitago:invite')||null}});
    if(error)throw error;if(data?.error)throw new Error(data.error);return data;
  }

  async function handleRegister(){
    hideMsgs();const bizName=$('reg-business').value.trim(),phone=internationalPhone(),email=$('reg-email').value.trim().toLowerCase(),password=$('reg-password').value;
    if(!bizName)return showError('Escribe el nombre de tu negocio.');if(!validPhone(phone))return showError($('country-code').value==='+52'?'Escribe un número de México de 10 dígitos.':'Revisa el número internacional.');
    const btn=$('btn-register');btn.disabled=true;btn.textContent=oauthMode?'Preparando tu negocio…':'Creando cuenta…';const selectedPlan=new URLSearchParams(location.search).get('plan')||'reserva';
    try{
      if(oauthMode){const{data:auth}=await supabaseClient.auth.getUser();if(!auth?.user)throw new Error('La sesión de Google expiró. Vuelve a ingresar.');await completeOAuthBusiness(auth.user,bizName,phone,selectedPlan);location.replace('onboarding.html');return}
      if(!email)throw new Error('Escribe tu correo.');if(password.length<10)throw new Error('Usa una contraseña de al menos 10 caracteres.');
      const{data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:`${getAppBaseUrl()}admin/login.html`,data:{business_name:bizName,business_whatsapp:phone.e164,business_phone:phone.e164,plan_id:selectedPlan,invite_token:new URLSearchParams(location.search).get('invite')||localStorage.getItem('mycitago:invite')||null}}});
      if(error)throw error;if(!data.session){showInfo('Cuenta creada. Revisa tu correo, confirma tu cuenta y luego inicia sesión.');return}location.replace('onboarding.html');
    }catch(error){showError(error.message||'No se pudo completar el registro.')}finally{btn.disabled=false;btn.textContent=oauthMode?'Crear mi negocio':'Crear cuenta y negocio'}
  }

  async function handleForgot(){hideMsgs();const email=$('forgot-email').value.trim();if(!email)return showError('Escribe tu correo.');const{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(error)return showError(error.message);showInfo('Listo. Revisa tu correo y abre el enlace para crear una nueva contraseña.')}
  async function handleReset(){hideMsgs();const password=$('reset-password').value;if(password.length<10)return showError('Usa una contraseña de al menos 10 caracteres.');const{error}=await supabaseClient.auth.updateUser({password});if(error)return showError(error.message);await supabaseClient.auth.signOut();showView('login');showInfo('Contraseña actualizada. Inicia sesión con tu nueva contraseña.')}

  function prepareOAuthRegistration(user){oauthMode=true;showView('register');$('email-register-fields').classList.add('hidden');$('register-google-option').classList.add('hidden');$('oauth-profile').classList.remove('hidden');$('oauth-name').textContent=user.user_metadata?.full_name||user.user_metadata?.name||'Cuenta Google conectada';$('oauth-email').textContent=user.email||'';$('oauth-avatar').textContent=($('oauth-name').textContent||'G').slice(0,1).toUpperCase();$('card-title').textContent='Completa tu negocio';$('card-sub').textContent='Google ya verificó tu identidad. Sólo faltan los datos de tu negocio.';$('btn-register').textContent='Crear mi negocio'}

  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{oauthMode=false;$('email-register-fields').classList.remove('hidden');$('register-google-option').classList.remove('hidden');$('oauth-profile').classList.add('hidden');showView(b.dataset.view)}));
  $('btn-google').addEventListener('click',handleGoogle);$('btn-google-register').addEventListener('click',handleGoogle);
  window.addEventListener('pageshow',resetGoogleButtons);
  resetGoogleButtons();$('btn-login').addEventListener('click',handleLogin);$('btn-register').addEventListener('click',handleRegister);$('btn-forgot').addEventListener('click',handleForgot);$('btn-reset').addEventListener('click',handleReset);$('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});

  (async function start(){
    if(location.hash.includes('type=recovery')){showView('reset');return}
    const params=new URLSearchParams(location.search);
    const currentInvite=params.get('invite')||'';
    if(currentInvite)localStorage.setItem('mycitago:invite',currentInvite);
    else if(params.get('oauth')==='1')localStorage.removeItem('mycitago:invite');

    if(!window.MyCitaGoOAuth){showError('No se cargó el módulo de acceso con Google. Recarga la página.');return}
    const oauthReturn=window.MyCitaGoOAuth.isOAuthCallback(location.href);
    const oauthError=window.MyCitaGoOAuth.oauthErrorFromHash(location.href);

    if(oauthReturn && oauthError){
      if(history?.replaceState)history.replaceState({},document.title,window.MyCitaGoOAuth.cleanOAuthUrl(location.href));
      showError(`Google no completó el inicio de sesión: ${oauthError}`);
      return;
    }

    const session=await window.MyCitaGoOAuth.waitForAuthSession(supabaseClient,{timeoutMs:oauthReturn?8000:250});
    const user=session?.user||null;

    if(oauthReturn && history?.replaceState){
      history.replaceState({},document.title,window.MyCitaGoOAuth.cleanOAuthUrl(location.href));
    }

    if(user){
      if(await platformAdminFor(user.id)){location.replace('plataforma.html');return}
      const member=await membershipFor(user.id);
      if(member){
        if(currentInvite){
          await supabaseClient.rpc('claim_business_invite',{p_token:currentInvite,p_business_id:member.business_id}).catch(()=>{});
          localStorage.removeItem('mycitago:invite');
        }
        location.replace('index.html');return
      }
      prepareOAuthRegistration(user);return
    }
    if(oauthReturn){showError('Google regresó a MyCitaGo, pero no se recibió una sesión válida. Intenta de nuevo. Si Google muestra un error, MyCitaGo lo mostrará aquí.');return}
    if(params.get('view')==='register')showView('register');
  })();
</script>
</body>
</html>
