<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobante de pago · MyCitaGo</title><style>body{font:16px system-ui;background:#f7f5fb;color:#21192c;margin:0;padding:24px}main{max-width:560px;margin:30px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #24143c16}label{display:block;margin:18px 0 6px;font-weight:600}input,select,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d7d0e2;border-radius:10px;font:inherit}button{margin-top:20px;background:#6930c3;color:white;border:0;cursor:pointer}button:disabled{opacity:.55}a{color:#6930c3}small{color:#635970}#status{margin-top:15px;white-space:pre-wrap}</style></head><body><main><h1>Enviar comprobante de pago</h1><p>Realiza tu pago en Mercado Pago y adjunta el comprobante. Tu plan se activará únicamente después de la validación.</p><form id="proof-form"><label for="plan">Plan</label><select id="plan" required></select><p><a id="payment-link" target="_blank" rel="noopener">Abrir enlace de Mercado Pago ↗</a></p><label for="reference">Referencia del pago</label><input id="reference" maxlength="120" minlength="4" required autocomplete="off" placeholder="Número de operación"><label for="receipt">Comprobante (PDF, JPG o PNG, máximo 5 MB)</label><input id="receipt" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" required><button id="send" type="submit">Enviar a revisión</button><p id="status" role="status" aria-live="polite"></p></form><p><small>El comprobante no activa el plan automáticamente. Nuestro equipo verificará el pago.</small></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/subscription-proof.js"></script></body></html>
