<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1"><script data-mycitago-theme-boot>(function(){try{var p=localStorage.getItem('mycitago:tenant-theme')||'system',d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';document.documentElement.dataset.theme=d;document.documentElement.dataset.ctTheme=d;document.documentElement.style.colorScheme=d}catch(e){}})();</script>
  <title>Reseñas · MyCitaGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/citago-admin.css">
  <link rel="stylesheet" href="../css/admin-reviews.css">
  <link rel="stylesheet" href="../css/admin-reviews-verified.css?v=20260914-reviews-fix1">
  <link rel="stylesheet" href="../css/mycitago-themes.css">
  <script src="../js/ui-theme.js"></script>
<link rel="stylesheet" href="../css/mycitago-fase3-unified.css">
</head>
<body>
<div id="citago-shell"></div>
<main class="reviews-page">
  <header class="ct-page-head reviews-head">
    <div>
      <span class="ct-eyebrow">REPUTACIÓN</span>
      <h1>Reputación de tu negocio</h1>
      <p>Administra las reseñas verificadas de tus clientes en MyCitaGo.</p>
    </div>
  </header>

  <section id="review-access-alert" class="google-config-alert hidden" role="status">
    <strong id="review-access-title">Estado de reseñas</strong>
    <span id="review-access-message"></span>
  </section>


  <section class="reviews-summary">
    <article class="ct-stat-card"><span>Calificación</span><strong id="review-rating">–</strong><small>Promedio de reseñas publicadas</small></article>
    <article class="ct-stat-card"><span>Reseñas</span><strong id="review-total">0</strong><small>Reseñas publicadas en MyCitaGo</small></article>
    <article class="ct-stat-card verified-stat"><span>Clientes verificados</span><strong id="verified-total">0</strong><small>Reseñas ligadas a citas completadas</small></article>
  </section>

  <div class="reviews-toolbar">
    <select id="review-filter" class="ct-input">
      <option value="">Todas las reseñas visibles</option>
      <option value="verified">Clientes verificados</option>
      <option value="internal">Solo MyCitaGo</option>
      <option value="hidden">Ocultas</option>
      <option value="5">5 estrellas</option>
      <option value="4">4 estrellas</option>
      <option value="low">3 o menos</option>
      <option value="unanswered">Sin responder</option>
    </select>
  </div>

  <section id="reviews-list"></section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/admin-reviews.js?v=20260914-reviews-fix1"></script>
<script src="../js/citago-shell.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>CitagoShell.mount({mode:'tenant',activePage:'resenas'}));</script>
</body>
</html>
