<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deja tu reseña · MyCitaGo</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/public-review.css"></head><body class="review-public"><main class="review-shell"><section class="review-card"><span class="review-brand">MyCitaGo</span><h1 id="review-title">Tu opinión nos ayuda a crecer</h1><p id="review-business">Cargando…</p><div id="review-error" class="review-state hidden"></div><div id="review-choices" class="review-choices hidden"><button id="review-choice-internal" type="button"><strong>MyCitaGo</strong><span>Deja estrellas y comentario aquí</span></button><a id="review-choice-google" class="hidden" target="_blank" rel="noopener"><strong>Google</strong><span>Publica tu opinión en Google</span></a></div><form id="review-form" class="hidden"><label>Tu nombre<input id="review-name" maxlength="80" placeholder="Nombre"></label><div class="stars" id="review-stars" aria-label="Calificación"><button type="button" data-rating="1">★</button><button type="button" data-rating="2">★</button><button type="button" data-rating="3">★</button><button type="button" data-rating="4">★</button><button type="button" data-rating="5">★</button></div><label>Comentario<textarea id="review-comment" maxlength="1200" rows="5" placeholder="Cuéntanos cómo fue tu experiencia"></textarea></label><button id="review-submit" class="primary" type="submit">Enviar reseña</button></form><div id="review-success" class="review-state hidden"><strong>¡Gracias por tu opinión!</strong><span>Tu reseña fue publicada en MyCitaGo.</span></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/public-review.js"></script></body></html>
